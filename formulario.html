<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Lucas Daniel Gomes Echeverria">
    <meta name="description"
        content="Formulário de avaliação de produto do curso WDD 131 da byu para aplicar entendimentos sobre uso de formuilario e armazenamento local da semana05">
    <title>Formulário de Avaliação de Produto | WDD 131</title>
    <link rel="stylesheet" href="estilos/formulario.css">

    <script src="scripts/formulario.js" defer></script>
</head>

<body>
    <header>
        <h1>Avaliação do Produto</h1>
        <nav aria-label="Navegação principal">
            <ul>
                <li><a href="https://linkedin.com/in/lucas-daniel-gomes-echeverria-b79881209">LinkedIn</a></li>
                <li><a href="https://byupw.instructure.com/">Canvas</a></li>
                <li><a
                        href="https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/18?lang=por&id=p10#p10">Escritura</a>
                </li>
                <li><a href="#">Projeto Final</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <form action="avaliacao.html" method="get" class="fw1">
            <fieldset>
                <legend>Informações do produto</legend>
                <label for="produto">Nome do Produto <span class="required">*</span></label>
                <select id="produto" name="produto" required>
                    <option value="" disabled selected>Selecione um Produto...</option>
                </select>
            </fieldset>

            <fieldset>
                <legend>Classificação Geral <span class="required">*</span></legend>
                <div class="star-rating">
                    <input type="radio" name="stars" id="star-a" value="5" />
                    <label for="star-a" required></label>

                    <input type="radio" name="stars" id="star-b" value="4" />
                    <label for="star-b" required></label>

                    <input type="radio" name="stars" id="star-c" value="3" />
                    <label for="star-c" required></label>

                    <input type="radio" name="stars" id="star-d" value="2" />
                    <label for="star-d" required></label>

                    <input type="radio" name="stars" id="star-e" value="1" />
                    <label for="star-e" required></label>
                </div>

            </fieldset>

            <label for="dataInstalacao">Data de Instalação <span class="required">*</span></label>
            <input type="date" id="dataInstalacao" name="dataInstalacao" required>

            <fieldset>
                <legend>Quais recursos você achou úteis no produto?</legend>
                <p class="hint">(Marque todos os aplicáveis)</p>
                <label class="choice" for="durabilidade">
                    <input type="checkbox" id="durabilidade" name="recursos" value="durabilidade">
                    Durabilidade
                </label>
                <label class="choice" for="facilidade">
                    <input type="checkbox" id="facilidade" name="recursos" value="facilidade">
                    Facilidade de Uso
                </label>
                <label class="choice" for="desempenho">
                    <input type="checkbox" id="desempenho" name="recursos" value="desempenho">
                    Desempenho
                </label>
                <label class="choice" for="design">
                    <input type="checkbox" id="design" name="recursos" value="design">
                    Design
                </label>
            </fieldset>

            <label for="avaliacaoEscrita">Avaliação Escrita <span class="optional">(Opcional)</span></label>
            <textarea id="avaliacaoEscrita" name="avaliacaoEscrita" rows="5"></textarea>

            <label for="nomeUsuario">Seu Nome <span class="optional">(Opcional)</span></label>
            <input type="text" id="nomeUsuario" name="nomeUsuario" autocomplete="name">

            <input type="submit" value="Publicar Avaliação">
        </form>
    </main>

    <footer>
        <p>&copy;<span id="anoatual"></span> | Lucas Daniel Gomes Echeverria | Santa Catarina</p>
        <p>Última modificação: <span id="ultimaModificacao"></span></p>
    </footer>
</body>

</html>
