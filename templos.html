<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Lucas Daniel Gomes Echeverria">
    <meta name="description" content="Álbum de fotografias dos templos de A Igreja de Jesus Cristo dos Santos dos Últimos Dias.">
    <title>WDD 131 | Álbum de Templos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sansita:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilos/templos.css">
    <link rel="stylesheet" href="estilos/templos-grandes.css">
    <script src="scripts/templos.js" defer></script>
</head>
<body>
    <header>
        <h1>Álbum do Templo</h1>
        <button id="menu" type="button" aria-label="Abrir menu de navegação"
            aria-controls="menu-principal" aria-expanded="false">☰</button>
        <nav aria-label="Navegação principal">
            <ul id="menu-principal">
                <li><a href="#inicio">Página Inicial</a></li>
                <li><a href="#galeria">Antigo</a></li>
                <li><a href="#galeria">Novo</a></li>
                <li><a href="#galeria">Grande</a></li>
                <li><a href="#galeria">Pequeno</a></li>
            </ul>
        </nav>
    </header>
    <main id="inicio">
        <h2 id="galeria">Templos do Mundo</h2>
        <div class="grid">
            <figure><img src="imagens/templo-belo-horizonte.jpg" alt="Templo de Belo Horizonte, Brasil" loading="lazy"><figcaption>Templo de Belo Horizonte</figcaption></figure>
            <figure><img src="imagens/templo-brasilia.jpg" alt="Templo de Brasília, Brasil" loading="lazy"><figcaption>Templo de Brasília</figcaption></figure>
            <figure><img src="imagens/templo-campinas.jpg" alt="Templo de Campinas, Brasil" loading="lazy"><figcaption>Templo de Campinas</figcaption></figure>
            <figure><img src="imagens/templo-fortaleza.jpg" alt="Templo de Fortaleza, Brasil" loading="lazy"><figcaption>Templo de Fortaleza</figcaption></figure>
            <figure><img src="imagens/templo-manaus.jpg" alt="Templo de Manaus, Brasil" loading="lazy"><figcaption>Templo de Manaus</figcaption></figure>
            <figure><img src="imagens/templo-porto-alegre.jpg" alt="Templo de Porto Alegre, Brasil" loading="lazy"><figcaption>Templo de Porto Alegre</figcaption></figure>
            <figure><img src="imagens/templo-recife.jpg" alt="Templo de Recife, Brasil" loading="lazy"><figcaption>Templo de Recife</figcaption></figure>
            <figure><img src="imagens/templo-riodejaneiro.jpg" alt="Templo do Rio de Janeiro, Brasil" loading="lazy"><figcaption>Templo do Rio de Janeiro</figcaption></figure>
            <figure><img src="imagens/templo-salvador.jpg" alt="Templo de Salvador, Brasil" loading="lazy"><figcaption>Templo de Salvador</figcaption></figure>
        </div>
    </main>
    <footer>
        <p>&copy; <span id="anoatual"></span> | Lucas Daniel Gomes Echeverria | Santa Catarina</p>
        <p id="ultimaModificacao"></p>
    </footer>
</body>
</html>
